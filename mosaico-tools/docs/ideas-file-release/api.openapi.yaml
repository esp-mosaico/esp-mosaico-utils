openapi: 3.1.0
info:
  title: Mosaico Ideas immutable file release
  version: '1'
  description: Single ZIP upload creates a draft. Publication is a separate server workflow.
servers:
  - url: https://ideas.example/api/v1
paths:
  /agent/projects:
    post:
      operationId: createAgentProject
      security: [{bearer: []}]
      requestBody: {$ref: '#/components/requestBodies/Release'}
      responses:
        '201': {$ref: '#/components/responses/ProjectDraft'}
        default: {$ref: '#/components/responses/Error'}
  /agent/projects/{public_id}:
    patch:
      operationId: replaceAgentProjectDraft
      description: Last successful upload replaces the unsubmitted draft. No version precondition. Published versions are immutable.
      security: [{bearer: []}]
      parameters:
        - in: path
          name: public_id
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$'}
      requestBody: {$ref: '#/components/requestBodies/Release'}
      responses:
        '200': {$ref: '#/components/responses/ProjectDraft'}
        '409':
          description: VERSION_ALREADY_PUBLISHED or PROJECT_NOT_EDITABLE. No automatic create fallback.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Error'}}
        default: {$ref: '#/components/responses/Error'}
  /ideas/{code}/manifest.json:
    get:
      operationId: getLatestCompatibleIdea
      parameters:
        - {$ref: '#/components/parameters/Code'}
        - {in: query, name: profile, required: true, schema: {const: esp-mosaico/v2}}
        - {in: query, name: chip_id, required: true, schema: {type: integer, minimum: 0}}
        - {in: query, name: flash_size, required: true, schema: {type: integer, minimum: 1}}
        - {in: query, name: recovery_version, required: true, schema: {type: string, minLength: 1}}
        - in: header
          name: Accept
          schema: {type: string, enum: [multipart/related, application/json, '*/*'], default: application/json}
          description: Devices request multipart/related to obtain a complete preview in one response. JSON is the raw manifest representation for inspection.
        - in: query
          name: locale
          schema: {type: string, enum: [zh-CN, en]}
          description: Required exactly once for multipart/related; forbidden for JSON. Selects preview assets, never the release or root bytes.
      responses:
        '200': {$ref: '#/components/responses/PreviewOrManifest'}
        '409':
          description: NO_COMPATIBLE_RELEASE; no visible release satisfies capabilities.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Error'}}
        default: {$ref: '#/components/responses/Error'}
  /ideas/{code}/releases/{release_id}/manifest.json:
    get:
      operationId: getFixedIdeaRelease
      parameters:
        - {$ref: '#/components/parameters/Code'}
        - {in: path, name: release_id, required: true, schema: {type: string, maxLength: 64}}
      responses:
        '200': {$ref: '#/components/responses/Manifest'}
        default: {$ref: '#/components/responses/Error'}
  /ideas/files/{sha256}:
    get:
      operationId: getPublishedFile
      parameters:
        - {in: path, name: sha256, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
        - in: query
          name: device_id
          required: false
          schema: {type: string, minLength: 1, maxLength: 128}
          description: Device Identity.
      responses:
        '200':
          description: Exact published bytes, immutable. No redirects, HTTP compression or draft disclosure.
          headers:
            ETag: {schema: {type: string}, description: Quoted SHA-256 of the raw response.}
            Cache-Control: {schema: {type: string}, description: 'public, max-age=31536000, immutable'}
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        default: {$ref: '#/components/responses/Error'}
components:
  requestBodies:
    Release:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [release]
            properties:
              release: {type: string, format: binary, description: One mosaico-ideas/release/1 ZIP, at most 104857600 bytes.}
          encoding:
            release: {contentType: application/zip}
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    Code:
      in: path
      name: code
      required: true
      schema: {type: string, pattern: '^[0-9]{6}$'}
  responses:
    ProjectDraft:
      description: Saved draft. Identity and app-number assignment for device publication are cloud responsibilities.
      content:
        application/json: {schema: {$ref: '#/components/schemas/ProjectDetail'}}
    PreviewOrManifest:
      description: One snapshot. Multipart contains exact root, firmware manifest, selected display and all selected assets in declared order (4-6 parts); no firmware binary. Root includes author (a plain-text display name) for new releases; historical immutable releases may omit it. Author is frozen with the release and identical across locales. Root is at most 64 KiB, firmware manifest 3072 bytes, locale resources 1 MiB, framing 4096 bytes, whole body 1121280 bytes. See preview-response.md for the bounded MIME profile. No fallback file GET for preview.
      headers:
        ETag: {schema: {type: string}, description: Required strong quoted SHA-256 of the entire response body including multipart framing. Never use a multipart ETag as the root manifest digest.}
        Cache-Control: {schema: {const: no-store}}
        Vary: {schema: {const: Accept}}
      content:
        multipart/related:
          schema: {type: string, format: binary}
        application/json:
          schema: {$ref: download-manifest.schema.json}
    Manifest:
      description: Raw device manifest, never an envelope. Includes root-level author (a plain-text display name) for new releases; historical immutable releases may omit it. Author is frozen with the release, never injected or updated at GET time. Latest is no-store; fixed releases immutable. No 304. Unknown or duplicate query parameters rejected.
      headers:
        ETag: {schema: {type: string}, description: Required strong quoted SHA-256 of the raw manifest bytes.}
        Cache-Control: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: download-manifest.schema.json}
    Error:
      description: See protocol error table for HTTP status, stable code and retry rules. A nonexistent, disabled or content_type-mismatched project.category_id returns 400 invalid_category.
      headers:
        Retry-After: {schema: {type: string}, description: Seconds or HTTP date; no retry before this delay.}
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
  schemas:
    Sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    ProjectDetail:
      type: object
      required: [public_id, status]
      properties:
        public_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$'}
        status: {const: draft}
        app_number: {type: [string, 'null'], pattern: '^[0-9]{6}$'}
        title: {type: string}
        draft_url: {type: string, format: uri-reference}
    Error:
      type: object
      required: [code]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        details:
          type: object
          properties:
            reason: {type: string, description: Stable machine-readable reason such as FILE_HASH_MISMATCH.}
            path: {type: string, description: Relative archive member path.}
            field: {type: [string, integer], description: Related field or category ID for invalid_category.}
